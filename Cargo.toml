[package]
name = "koryto"
version = "0.1.0"
edition = "2024"
description = "Calorie and weight log for a household: API, web UI, CLI and MCP server"
license = "MIT"
default-run = "koryto"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 4
